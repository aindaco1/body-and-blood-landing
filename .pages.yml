content:
  - name: book
    label: Book landing page
    type: file
    path: _data/book.yml
    fields:
      - name: title
        label: Title
        type: string
      - name: subtitle
        label: Subtitle
        type: string
      - name: description
        label: Description
        type: text
      - name: publication_label
        label: Publication label
        type: string
      - name: authors
        label: Authors
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
      - name: intro
        label: Intro
        type: object
        fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: title
            label: Title
            type: string
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
      - name: praise
        label: Praise
        type: object
        list: true
        fields:
          - name: quote
            label: Quote
            type: text
          - name: name
            label: Name
            type: string
          - name: credit
            label: Credit
            type: string
      - name: excerpt
        label: Excerpt
        type: object
        fields:
          - name: publication
            label: Publication
            type: string
          - name: title
            label: Title
            type: string
          - name: subtitle
            label: Subtitle
            type: string
          - name: description
            label: Description
            type: text
          - name: url
            label: Url
            type: string
          - name: date
            label: Date
            type: string
      - name: reading
        label: Reading
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: author
            label: Author
            type: string
          - name: label
            label: Label
            type: string
          - name: url
            label: Url
            type: string
      - name: podcasts
        label: Podcasts and audio
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: label
            label: Label
            type: string
          - name: date
            label: Date (optional)
            type: string
          - name: duration
            label: Duration (optional)
            type: string
          - name: description
            label: Description
            type: text
          - name: url
            label: Url
            type: string
          - name: link_label
            label: Listening link label
            type: string
      - name: retailers
        label: Retailers
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: detail
            label: Detail
            type: string
          - name: url
            label: Url
            type: string
