<!doctype html>
<html lang="{{ site.lang }}">
<head>{% include head.html %}</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="atmosphere" aria-hidden="true">
    <img id="pool" src="{{ '/assets/media/pool-still.webp' | relative_url }}" data-motion-src="{{ '/assets/media/pool-ripple.gif' | relative_url }}" alt="" width="1400" height="1676" fetchpriority="high">
  </div>
  <header class="site-header">
    <a class="wordmark" href="#" aria-label="Body and Blood, home">B<span aria-hidden="true">✝</span>B</a>

      <a href="#about">The book</a>
      <a href="#read">Read & listen</a>
      <a class="nav-buy" href="#buy">Get your copy <span aria-hidden="true">↗</span></a>

    <a href="#" class="footer-title">Body + Blood</a>

    <a href="{{ site.data.book.publisher_url }}">Published by NYU Press <span aria-hidden="true">↗</span></a>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
