{% assign book = site.data.book %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title | escape }}</title>
<meta name="description" content="{{ book.description | escape }}">
<meta name="theme-color" content="#200707">
<link rel="canonical" href="{{ '/' | absolute_url }}">
<meta property="og:type" content="book">
<meta property="og:title" content="{{ site.title | escape }}">
<meta property="og:description" content="{{ book.description | escape }}">
<meta property="og:url" content="{{ '/' | absolute_url }}">
<meta property="og:image" content="{{ '/assets/media/social.jpg' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The red cover of Body and Blood: Catholic Horror in America">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/media/favicon.svg' | relative_url }}">
<link rel="preload" href="{{ '/assets/fonts/julius-sans-one.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/media/pool-still.webp' | relative_url }}" as="image">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Book",
  "name": {{ book.title | append: ': ' | append: book.subtitle | jsonify }},
  "description": {{ book.description | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "image": {{ '/assets/media/book-cover.webp' | absolute_url | jsonify }},
  "isbn": {{ book.isbn | jsonify }},
  "inLanguage": "en",
  "publisher": {"@type": "Organization", "name": {{ book.publisher | jsonify }}},
  "author": [{% for author in book.authors %}{"@type": "Person", "name": {{ author.name | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]
}
</script>
