title: Body and Blood
subtitle: Catholic Horror in America
description: "A cultural history of Catholicism and American horror, from the terrors on our screens to the histories that haunt them. By Matthew J. Cressler, Jack Lee Downey, Kathleen Holscher, and Michael Pasquier."
publisher: NYU Press
