intro:
  eyebrow: The book
  title: "American horror has a Catholic heart."
  paragraphs:
    - "Possessed children. Haunted convents. Bodies caught between the sacred and the monstrous. Why does American horror keep returning to Catholicism?"
    - "Four scholars follow that question from fiction and film into American religious history. Along the way, they explore how Catholic images shape our nightmares—and how the Church’s own histories of power, colonialism, and abuse unsettle the line between horror and reality."
    - "For horror fans, curious readers, and anyone willing to look a little closer."
