title: Body and Blood
subtitle: Catholic Horror in America
description: "A cultural history of Catholicism and American horror, tracing the genre’s religious roots and the Catholic histories behind its stories. By Matthew J. Cressler, Jack Lee Downey, Kathleen Holscher, and Michael Pasquier."
publisher: NYU Press
